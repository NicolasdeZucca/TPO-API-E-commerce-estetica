spring.application.name=estetica

# MySQL en Docker. El host usa localhost:3307; dentro de Compose se sobrescribe
# SPRING_DATASOURCE_URL con el nombre del servicio y el puerto interno 3306.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/ecommerce_db3?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
jwt.secret=MiClaveSecretaSuperSeguraParaElTPO2026DeEsteticaEcommerce
jwt.expiration=86400000
